<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hojek</title>
<style>
  :root {
    --sky-a: #eef6ee; --sky-b: #dcebdd; --ground: #b9d4b4; --ground-edge: #a3c49d;
    --ink: #2c3a4a; --muted: #64748b; --card: rgba(255,255,255,.82); --chip: #ffffff;
    --chip-border: #d5e2d3; --accent: #e8a0ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky-a: #1a2233; --sky-b: #141b29; --ground: #24324a; --ground-edge: #2d3d59;
      --ink: #e7edf5; --muted: #93a1b5; --card: rgba(24,32,46,.85); --chip: #223047;
      --chip-border: #33445f; --accent: #d98995;
    }
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif; color: var(--ink);
    background: linear-gradient(var(--sky-a), var(--sky-b) 70%);
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #floor {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    background: var(--ground); border-top: 3px solid var(--ground-edge);
  }
  #card {
    position: fixed; top: 16px; left: 16px; max-width: 340px; z-index: 5;
    background: var(--card); backdrop-filter: blur(8px);
    border: 1px solid var(--chip-border); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 6px 24px rgba(20, 30, 40, .12);
  }
  #card h1 { font-size: 20px; letter-spacing: .3px; }
  #card h1 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
  #card p { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #chips button {
    font: 600 12px system-ui, sans-serif; color: var(--ink); cursor: pointer;
    background: var(--chip); border: 1px solid var(--chip-border);
    border-radius: 999px; padding: 4px 11px; transition: transform .08s, border-color .15s;
  }
  #chips button:hover { transform: translateY(-1px); border-color: var(--accent); }
  #chips button.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #hint { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  #pet {
    position: fixed; z-index: 3; width: 192px; height: 208px; cursor: grab;
    background: url("hojek-atlas.png") no-repeat; background-size: 1536px 2288px;
    transform-origin: 50% 100%; touch-action: none; will-change: left, bottom;
  }
  #pet.held { cursor: grabbing; }
  #shadow {
    position: fixed; z-index: 2; width: 110px; height: 20px; border-radius: 50%;
    background: rgba(20, 30, 25, .22); filter: blur(3px);
    transform-origin: center; pointer-events: none;
  }
  #bubble {
    position: fixed; z-index: 4; padding: 5px 11px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--chip-border);
    font-size: 13px; font-weight: 600; pointer-events: none;
    opacity: 0; transition: opacity .25s; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="floor"></div>
<div id="card">
  <h1>Hojek <small>plant-fox &middot; hatched 2026-07-28</small></h1>
  <p>A curious, methodical plant-fox with a quietly playful streak.</p>
  <div id="chips"></div>
  <div id="hint">drag him around &middot; click = wave &middot; double-click = jump</div>
</div>
<div id="shadow"></div>
<div id="pet"></div>
<div id="bubble"></div>

<script>
"use strict";
/* Sprite atlas: 8 cols x 11 rows, 192x208 cells. Look rows 9-10 were never
   generated by the hatch pipeline, so cursor-look falls back to idle. */
const CW = 192, CH = 208, FLOOR = 56, SCALE = 0.72;

const S = {
  "idle":          { row: 0, frames: 6, fps: 6,  loop: true },
  "running-right": { row: 1, frames: 8, fps: 12, loop: true },
  "running-left":  { row: 2, frames: 8, fps: 12, loop: true },
  "waving":        { row: 3, frames: 4, fps: 7,  loop: true },   // looped for 2 cycles as one-shot
  "jumping":       { row: 4, frames: 5, fps: 10, loop: false },
  "failed":        { row: 5, frames: 8, fps: 4,  loop: true },
  "waiting":       { row: 6, frames: 6, fps: 6,  loop: true },
  "running":       { row: 7, frames: 6, fps: 8,  loop: true },
  "review":        { row: 8, frames: 6, fps: 7,  loop: true },
};

const pet = document.getElementById("pet");
const shadow = document.getElementById("shadow");
const bubble = document.getElementById("bubble");
const chips = document.getElementById("chips");

/* ---------- animator ---------- */
let state = "idle", frame = 0, frameClock = 0;
function setState(name) {
  if (!S[name] || name === state) return;
  state = name; frame = 0; frameClock = 0; paint();
}
function paint() {
  const s = S[state];
  pet.style.backgroundPosition = `-${frame * CW}px -${s.row * CH}px`;
}

/* ---------- world ---------- */
let x = innerWidth * 0.6;          // pet center, px
let y = 0;                         // height above floor, px
let vy = 0;
let facing = 1;
const W = () => innerWidth;
const minX = 90, maxX = () => W() - 90;

/* mode: idle | walk | act (one-shot) | pose (looped panel state) | held | fall */
let mode = "idle";
let walkTarget = 0, actUntil = 0, nextThought = now() + 2500;
let pinned = null;                 // panel-pinned state name
function now() { return performance.now(); }

function place() {
  const half = CW * SCALE / 2;
  pet.style.left = (x - half) + "px";
  pet.style.bottom = (FLOOR + y * 1 - 14) + "px";
  pet.style.transform = `scale(${SCALE})`;
  const squash = Math.max(.45, 1 - y / 320);
  shadow.style.left = (x - 55 * squash) + "px";
  shadow.style.bottom = (FLOOR - 10) + "px";
  shadow.style.transform = `scaleX(${squash})`;
  shadow.style.opacity = mode === "held" ? .35 : .8;
}

/* ---------- speech ---------- */
let bubbleT = 0;
function say(text, ms = 1400) {
  bubble.textContent = text;
  bubble.style.opacity = 1;
  clearTimeout(bubbleT);
  bubbleT = setTimeout(() => bubble.style.opacity = 0, ms);
}
function placeBubble() {
  bubble.style.left = (x + 40) + "px";
  bubble.style.bottom = (FLOOR + y + CH * SCALE + 2) + "px";
}

/* ---------- behaviors ---------- */
function startWalk() {
  walkTarget = minX + Math.random() * (maxX() - minX);
  if (Math.abs(walkTarget - x) < 60) { scheduleThought(1500); return; }
  facing = walkTarget > x ? 1 : -1;
  mode = "walk";
  setState(facing > 0 ? "running-right" : "running-left");
}
function startAct(name, ms, phrase) {
  mode = "act"; actUntil = now() + ms;
  setState(name);
  if (phrase) say(phrase);
}
function jump() {
  mode = "fall"; vy = 520;
  setState("jumping");
}
function backToIdle() {
  mode = "idle"; setState("idle");
  scheduleThought();
}
function scheduleThought(ms) {
  nextThought = now() + (ms ?? (2500 + Math.random() * 4500));
}
function think() {
  if (mode !== "idle" || pinned) return;
  const roll = Math.random();
  if (roll < .42) startWalk();
  else if (roll < .54) startAct("waving", 1150, "hi!");
  else if (roll < .64) jump();
  else if (roll < .76) startAct("waiting", 3200);
  else if (roll < .86) startAct("review", 3000);
  else if (roll < .92) startAct("failed", 5200, "zzz…");
  else scheduleThought(2000);
}

/* ---------- interactions ---------- */
let dragging = false, dragMoved = 0, lastPX = 0, clickTimer = 0;
pet.addEventListener("pointerdown", e => {
  pet.setPointerCapture(e.pointerId);
  dragging = true; dragMoved = 0; lastPX = e.clientX;
  pet.classList.add("held");
});
pet.addEventListener("pointermove", e => {
  if (!dragging) return;
  dragMoved += Math.abs(e.clientX - lastPX) + Math.abs(e.movementY || 0);
  if (dragMoved > 6) {
    mode = "held"; pinned = null; syncChips();
    x = Math.min(maxX(), Math.max(minX, e.clientX));
    y = Math.max(0, innerHeight - e.clientY - FLOOR - 40);
    const dx = e.clientX - lastPX;
    if (Math.abs(dx) > 1.5) { facing = dx > 0 ? 1 : -1; }
    setState(facing > 0 ? "running-right" : "running-left");
  }
  lastPX = e.clientX;
});
pet.addEventListener("pointerup", e => {
  pet.releasePointerCapture(e.pointerId);
  pet.classList.remove("held");
  const wasDrag = dragMoved > 6;
  dragging = false;
  if (wasDrag) { mode = "fall"; vy = 0; setState("jumping"); frame = 2; return; }
  /* click vs double-click */
  if (clickTimer) {
    clearTimeout(clickTimer); clickTimer = 0;
    pinned = null; syncChips(); jump();
  } else {
    clickTimer = setTimeout(() => {
      clickTimer = 0;
      if (mode === "idle" || mode === "act" || mode === "pose") {
        pinned = null; syncChips(); startAct("waving", 1150, "hi!");
      }
    }, 260);
  }
});

/* ---------- state panel ---------- */
const PANEL = [
  ["idle", "idle"], ["running", "working"], ["waiting", "waiting"],
  ["review", "review"], ["failed", "failed"], ["waving", "wave"], ["jumping", "jump"],
];
for (const [name, label] of PANEL) {
  const b = document.createElement("button");
  b.textContent = label; b.dataset.state = name;
  b.addEventListener("click", () => {
    if (name === "jumping") { pinned = null; if (mode !== "held") jump(); }
    else if (name === "waving") { pinned = null; if (mode !== "held") startAct("waving", 1150, "hi!"); }
    else if (name === "idle") { pinned = null; backToIdle(); }
    else { pinned = name; mode = "pose"; setState(name); }
    syncChips();
  });
  chips.appendChild(b);
}
function syncChips() {
  for (const b of chips.children)
    b.classList.toggle("active", pinned ? b.dataset.state === pinned : b.dataset.state === "idle" && mode === "idle");
}

/* ---------- main loop ---------- */
let last = now();
function tick(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;

  /* frame stepping */
  const s = S[state];
  frameClock += dt;
  if (frameClock >= 1 / s.fps) {
    frameClock = 0;
    if (frame + 1 >= s.frames) { if (s.loop) frame = 0; }
    else frame++;
    paint();
  }

  /* movement */
  if (mode === "walk") {
    x += facing * 130 * dt;
    if ((facing > 0 && x >= walkTarget) || (facing < 0 && x <= walkTarget)) backToIdle();
  } else if (mode === "fall") {
    vy -= 1600 * dt; y += vy * dt;
    if (y <= 0) { y = 0; vy = 0; backToIdle(); }
  } else if (mode === "act") {
    if (now() >= actUntil) backToIdle();
  } else if (mode === "idle") {
    if (now() >= nextThought) think();
  }

  x = Math.min(maxX(), Math.max(minX, x));
  place(); placeBubble();
  requestAnimationFrame(tick);
}

paint(); place(); syncChips();
say("hello! I hatched 🌱", 2600);
requestAnimationFrame(tick);
</script>
</body>
</html>
